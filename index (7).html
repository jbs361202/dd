<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>충북 날씨 실시간 대시보드</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-color: #1b263b;
            --text-main: #e0e1dd;
            --accent-blue: #00b4d8;
            --accent-green: #06d6a0;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            margin: 0; padding: 20px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .author { 
            font-size: 1.1rem; 
            color: var(--accent-green); 
            margin-top: 5px;
            font-weight: bold;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            max-width: 1200px; margin: 0 auto;
        }
        .chart-card {
            background: var(--card-color);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .loading { text-align: center; font-size: 1.2rem; color: var(--accent-blue); }
    </style>
</head>
<body>

<div class="header">
    <h1>충청북도 기상 데이터 대시보드</h1>
    <div class="author">작성자: 1202 유서진</div>
    <p>공공데이터 포털 API 연동 (ASOS 일자료)</p>
</div>

<div id="loader" class="loading">데이터를 불러오는 중...</div>

<div class="dashboard-grid" id="dashboard" style="display: none;">
    <div class="chart-card" id="temp-chart"></div>
    <div class="chart-card" id="rain-chart"></div>
    <div class="chart-card" id="hum-wind-chart" style="grid-column: span 2;"></div>
</div>

<script>
    // 제공해주신 일반 인증키를 적용했습니다.
    const API_KEY = "9aeb4132fb09a2571a255a72b641bf08fc287c3db0865fb83b302ec94ec457f3"; 
    const ENDPOINT = "uddi:f052ed65-fd7a-4668-b7a5-f4bae187d58c_201810192136"; 
    const URL = `https://api.odcloud.kr/api/15029361/v1/${ENDPOINT}?page=1&perPage=50&serviceKey=${API_KEY}`;

    async function fetchData() {
        try {
            const response = await fetch(URL);
            if (!response.ok) throw new Error("네트워크 응답 에러");
            const json = await response.json();
            
            if (json.data && json.data.length > 0) {
                renderDashboard(json.data);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('dashboard').style.display = 'grid';
            } else {
                throw new Error("데이터가 비어있습니다.");
            }
        } catch (error) {
            console.error("API 호출 실패:", error);
            document.getElementById('loader').innerText = "데이터 로딩 실패 (인증키 활성화 대기 중이거나 키가 올바르지 않습니다)";
            document.getElementById('loader').style.color = "#ef476f";
        }
    }
